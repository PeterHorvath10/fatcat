# Orin Nano: XYZ scan of the probe over the chip. Delay steps through a fixed window after the scope edge.
# Used for the Orin JailbreakBench runs with 15 trials per prompt and for the Orin memory-check scan (that
# worker ignores the prompt fields).
#   Run: python host/run_orin_xyz.py

[experiment]
board = "orin"

[run]
trials = ""               # trials per stage position (--trials overrides)
pause_s = ""              # s; pause before every trial (thermal headroom, worker settles)
cool_every = ""           # every this many trials at a position ...
cool_s = ""               # s; ... an extra pause
seed = ""                 # optional RNG seed for amplitude/width/random-delay draws (empty: not reproducible)
trial_counter = "position" # delays and prompt slots restart at every position
next_position_on_reset = false

[stage]
mode = "dialog"           # Inspector dialog picks the stage and grid

[target]
ack_form = "slot"         # attempt + collection id + prompt slot + repeat
weight_report = false

[trigger]
source = "scope"          # "scope": the scope edge starts the pattern | "software": started after the ack
arm_to_ack_s = ""         # s; pause between arming glitcher/scope and sending the ack
timeout_s = ""            # s; without a scope edge for this long, start the pattern in software (trial ends)

[glitch]
delay_mode = "window"     # trial k: element (k mod trials_per_prompt) of the window
window_start_ns = ""      # ns after the scope edge, window [start, end)
window_end_ns = ""        # ns
window_step_ns = ""       # ns
amplitudes_v = ""         # list of pulse amplitudes (V), one drawn at random per trial
width_ns_min = ""         # ns; pulse widths min..max inclusive in steps of width_ns_step, drawn at random
width_ns_max = ""         # ns  (1 VC Glitcher count = 2 ns)
width_ns_step = ""        # ns
primary_repeat = ""       # repeat count of the primary pulse

[prompts]
trials_per_prompt = ""    # trials per prompt before the worker moves to the next (--trials-per-prompt)
start_prompt = ""         # first prompt slot (--start-prompt)

[thermal]
enabled = false

[scope]
capture = false

[results]
fetch = true              # copy the worker's log at the end
fetch_remote = ""         # scp source, user@host:path (e.g. the worker's mismatch-address TSV)
fetch_local_dir = ""      # local destination directory
