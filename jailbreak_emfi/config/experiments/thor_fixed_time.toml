# Thor: vLLM JailbreakBench (vllm_query_trigger worker), probe at its current position, one fixed delay
# after the scope edge, N trials per prompt slot; every trial's scope acquisition is saved (videos,
# layer-timing analysis).
# Run: EMFI_SCOPE__CAPTURE_DIR=<run>/scope python host/run_thor_fixed_time.py --trial-log <run>/trials.csv

[experiment]
board = "thor"

[run]
trials = ""               # trials per stage position (--trials overrides)
pause_s = ""              # s; pause before every trial (thermal headroom, worker settles)
cool_every = ""           # every this many trials at a position ...
cool_s = ""               # s; ... an extra pause
seed = ""                 # optional RNG seed for amplitude/width/random-delay draws (empty: not reproducible)
trial_counter = "run"      # prompt slots keep advancing across positions
next_position_on_reset = false

[stage]
mode = "stay"             # probe stays where it is (moved by hand / goto_xyz.py)

[target]
ack_form = "slot_weights" # attempt + collection id + prompt slot + repeat + check-weights flag
weight_report = false

[trigger]
source = "scope"          # "scope": the scope edge starts the pattern | "software": started after the ack
arm_to_ack_s = ""         # s; pause between arming glitcher/scope and sending the ack
timeout_s = ""            # s; without a scope edge for this long, start the pattern in software (trial ends)

[glitch]
delay_mode = "window"     # a fixed delay is a one-count window: window_end_ns = window_start_ns + 2
window_start_ns = ""      # ns after the scope edge
window_end_ns = ""        # ns
window_step_ns = ""       # ns
amplitudes_v = ""         # list of pulse amplitudes (V), one drawn at random per trial
width_ns_min = ""         # ns; pulse widths min..max inclusive in steps of width_ns_step, drawn at random
width_ns_max = ""         # ns  (1 VC Glitcher count = 2 ns)
width_ns_step = ""        # ns
primary_repeat = ""       # repeat count of the primary pulse

[prompts]
trials_per_prompt = ""    # (the worker wraps the slot around its own prompt list)
start_prompt = ""

[thermal]
enabled = true

[scope]
capture = true

[results]
fetch = false
