# Thor: weight-reload hunt (vllm_reload_trigger worker). Each trial the worker reloads the weights; the
# pulse lands in a window after the scope edge, and the worker reports which tensors changed. Driven by
# host/weight_reload/hunt_layers.sh, which sets the window per round (EMFI_GLITCH__WINDOW_START_NS/END_NS).

[experiment]
board = "thor"

[run]
trials = ""               # trials per stage position (--trials overrides)
pause_s = ""              # s; pause before every trial (thermal headroom, worker settles)
cool_every = ""           # every this many trials at a position ...
cool_s = ""               # s; ... an extra pause
seed = ""                 # optional RNG seed for amplitude/width/random-delay draws (empty: not reproducible)
trial_counter = "run"      # prompt slots keep advancing across positions
next_position_on_reset = false

[stage]
mode = "stay"             # probe stays where it is (moved by hand / goto_xyz.py)

[target]
ack_form = "slot_weights" # attempt + collection id + prompt slot + repeat + check-weights flag
weight_report = true

[trigger]
source = "scope"          # "scope": the scope edge starts the pattern | "software": started after the ack
arm_to_ack_s = ""         # s; pause between arming glitcher/scope and sending the ack
timeout_s = ""            # s; without a scope edge for this long, start the pattern in software (trial ends)

[glitch]
delay_mode = "window"     # a fixed delay is a one-count window: window_end_ns = window_start_ns + 2
window_start_ns = ""      # ns after the scope edge
window_end_ns = ""        # ns
window_step_ns = ""       # ns
amplitudes_v = ""         # list of pulse amplitudes (V), one drawn at random per trial
width_ns_min = ""         # ns; pulse widths min..max inclusive in steps of width_ns_step, drawn at random
width_ns_max = ""         # ns  (1 VC Glitcher count = 2 ns)
width_ns_step = ""        # ns
primary_repeat = ""       # repeat count of the primary pulse

[prompts]
trials_per_prompt = ""    # (the worker wraps the slot around its own prompt list)
start_prompt = ""

[thermal]
enabled = true

[scope]
capture = false

[results]
fetch = false

[hunt]                    # host/weight_reload/hunt_layers.sh and window.py
model = ""                # served model name (vLLM)
layers = ""               # list of layers whose down_proj to wipe, in order
max_trials = ""           # give a layer up after this many trials
round_trials = ""         # trials per controller round (the window is recomputed between rounds)
min_sensible = ""         # sanity check after a wipe: at least this many coherent answers ([keyword] in analysis.toml)
full_wipe_elems = ""      # a hit counts as a wipe of the target when > this many elements changed
out_dir = ""              # results directory (L<layer>/ per layer)
rounds_dir = ""           # per-round controller logs and trial CSVs
hits_csv = ""             # CSV of this hunt's hits (appended by hit_delay.py, read by window.py)
old_hits_csv = ""         # CSV of an earlier hunt's hits (window.py shifts it onto the new timing)
python = ""               # host Python with the VC Glitcher SDK and Inspector (runs the controller)
sudo_password_env = ""    # NAME of the env var with the Thor's sudo password (restart the reload worker)
reload_unit = ""          # systemd unit of the reload worker on the Thor
ready_pattern = ""        # journal line of that unit meaning "ready" (waited for after a restart)
remote_paper_code = ""    # jailbreak_emfi/ on the Thor, relative to its home (evaluation: jetson.thor.eval.*)
remote_out_dir = ""       # evaluation output directory on the Thor, relative to remote_paper_code
remote_python = ""        # Python on the Thor that runs the evaluation (vLLM venv)
remote_weight_checks = "" # weight-check record file on the Thor (last line copied per wipe)

[hunt.window]             # window.py: delay window for layer L from the earlier full wipes
checkpoint_order = ""     # list: layer order in the checkpoint (reload quantizes in this order)
gate_up_shift_ms = ""     # inline table module -> ms to add to a wipe of that module to date its layer's
                          # gate_up_proj, e.g. {gate_up_proj = 0, down_proj = ..., o_proj = ..., qkv_proj = ...}
per_layer_ms = ""         # ms per layer in checkpoint order (when only one side is dated)
slope_min_ms = ""         # clamp of the per-layer slope extrapolated from two dated layers
slope_max_ms = ""
dated_min_elems = ""      # only hits with more changed elements than this date a module
recent_hits = ""          # date a layer by the median of its last this-many full wipes
start_before_ms = ""      # window = [G - start_before_ms, G - end_before_ms], G = predicted gate_up time
end_before_ms = ""
widen_ms = ""             # widen the window start by widen_ms ...
widen_every_trials = ""   # ... per this many trials without any hit
override_dir = ""         # a file window_L<layer>.txt ("start_ms,end_ms") here wins over the prediction
